# /etc/fail2ban/filter.d/torneogg-login.conf
# Cuenta los POST a /api/auth/login que terminaron en 401 en el access log de Apache.
# (?i:...) hace la ruta insensible a mayúsculas: ASP.NET acepta /api/Auth/Login igual.
[Definition]
failregex = ^<HOST> .* "POST (?i:/api/auth/login)[^"]*" 401
ignoreregex =
