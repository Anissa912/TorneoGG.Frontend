# /etc/apache2/sites-available/torneogg.conf   (EC2 Frontend)
# Cambia TUDOMINIO.COM y la IP privada del Backend (ej. 10.18.1.10).
# Módulos: sudo a2enmod proxy proxy_http headers rewrite ssl
<VirtualHost *:80>
    ServerName TUDOMINIO.COM
    DocumentRoot /var/www/torneogg

    <Directory /var/www/torneogg>
        Options -Indexes
        AllowOverride None
        Require all granted
        # SPA: toda ruta que no sea archivo ni /api va a index.html
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Proxy hacia el Backend PRIVADO por el VPC Peering (el navegador nunca lo ve)
    ProxyPreserveHost On
    ProxyPass        /api/ http://10.18.1.10:5000/api/
    ProxyPassReverse /api/ http://10.18.1.10:5000/api/

    # Encabezados de seguridad (SecurityHeaders.com)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
</VirtualHost>
# Luego:  sudo certbot --apache -d TUDOMINIO.COM
# Certbot copia este VirtualHost al 443 con el certificado.
# Además, en /etc/apache2/conf-available/security.conf:  ServerTokens Prod  y  ServerSignature Off
